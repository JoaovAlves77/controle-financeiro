{% extends 'base.html' %}

{% block content %}

<h2>Nova Movimentação</h2>

<form method="POST">

<div class="mb-3">

<label>Descrição</label>

<input
type="text"
name="descricao"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Valor</label>

<input
type="number"
step="0.01"
name="valor"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Tipo</label>

<select
name="tipo"
class="form-control">

<option>
Receita
</option>

<option>
Despesa
</option>

</select>

</div>

<div class="mb-3">

<label>Categoria</label>

<input
type="text"
name="categoria"
class="form-control"
required>

</div>

<button
class="btn btn-primary">

Salvar

</button>

</form>

{% endblock %}
